name: Scoreloop
description: >-
  Scoreloop was a Munich, Germany based mobile social gaming company that
  provided a cross-platform SDK adding social features to mobile games -
  online leaderboards, achievements, player challenges, friend invites, and
  in-game virtual currency and monetization. The Scoreloop SDK supported
  Android, iOS, Windows Phone, Samsung Bada, Marmalade/AirPlay, and Unity 3D,
  and at its peak was used by more than 3,000 game developers. The company was
  backed by earlybird and was acquired by Research In Motion (BlackBerry) in
  2011; the standalone Scoreloop platform and its developer service were
  subsequently wound down. This profile is retained as a historical portfolio
  lead - there is no live public API, developer portal, or documentation
  surface remaining (the scoreloop.com domain now serves a suspended page and
  no developer host resolves), so no API artifacts are available to harvest.
